# SPDX-License-Identifier: GPL-2.0-only
# Build fki.ko and xnu.ko against the newest generic arm64 Ubuntu kernel's headers (the host the project runs on:
# Ubuntu 24.04 with its HWE kernel), and check that every source file names its license.
name: modules
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  cli-installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: CLI and installer tests
        run: |
          sudo python3 -m unittest -v tests.host.test_cli
          python3 -m unittest -v tests.host.test_xnulinux_doctor
  build-x86_64-fki:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Kernel headers
        run: |
          scripts/ci/disable-microsoft-apt-feed.sh
          sudo apt-get update -qq
          pkg=$(apt-cache search --names-only '^linux-headers-[0-9.]+-[0-9]+-generic$' | awk '{print $1}' | sort -V | tail -1)
          test -n "$pkg" || { echo "no x86_64 generic kernel headers found" >&2; exit 1; }
          sudo apt-get install -y -qq "$pkg" >/dev/null
          echo "KDIR=/usr/src/$pkg" >> "$GITHUB_ENV"
      - name: Build x86_64 FKI host backend
        run: tests/x86_64/build-fki.sh "$KDIR"
      - name: Reject an FKI module for another architecture
        run: bash tests/x86_64/test-build-fki-arch.sh
  x86_64-vms-debian13:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      # The stub VM creates /dev/console and /dev/null in its initramfs.
      options: --cap-add=MKNOD
    timeout-minutes: 45
    steps:
      - name: Install Git for checkout
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates
      - uses: actions/checkout@v4
      - name: Install Debian 13 headers and VM tools
        run: |
          apt-get update -qq
          apt-get install -y -qq build-essential linux-headers-amd64 qemu-system-x86 busybox-static cpio kmod sudo
          kdir=$(find /usr/src -mindepth 1 -maxdepth 1 -type d -name 'linux-headers-*-amd64' | sort -V | tail -1)
          case "$kdir" in */linux-headers-6.12.*-amd64) ;; *) echo "expected Debian 13 Linux 6.12 x86_64 headers; got $kdir" >&2; exit 1;; esac
          echo "KDIR=$kdir" >> "$GITHUB_ENV"
      - name: Build x86_64 FKI
        run: make -C "$KDIR" ARCH=x86_64 M="$PWD/fki-ko" CONFIG_DEBUG_INFO_BTF_MODULES= modules
      - name: Build x86_64 fail-closed XNU module
        run: make -C "$KDIR" ARCH=x86_64 M="$PWD/xnu-ko" KBUILD_EXTRA_SYMBOLS="$PWD/fki-ko/Module.symvers" modules
      - name: Verify Debian 13 x86_64 modules and record build inputs
        shell: bash
        run: |
          export LC_ALL=C
          release=$(cat "$KDIR/include/config/kernel.release")
          test -n "$release"
          source_commit=$(git -c safe.directory="$PWD" rev-parse --verify 'HEAD^{commit}')
          source_tree=$(git -c safe.directory="$PWD" rev-parse --verify 'HEAD^{tree}')
          stage="$RUNNER_TEMP/debian13-x86_64-module-build"
          mkdir "$stage"
          cp fki-ko/fki.ko xnu-ko/xnu.ko "$stage/"
          (
            echo 'profile=debian13-x86_64-fail-closed'
            printf 'source_commit=%s\nsource_tree=%s\n' "$source_commit" "$source_tree"
            echo "kernel_release=$release"
            echo 'kbuild_arch=x86_64'
            echo 'fki_btf_modules=disabled'
            echo '[os-release]'
            cat /etc/os-release
            echo '[build-packages]'
            dpkg-query -W -f='${binary:Package}=${Version}\n' "${KDIR##*/}" \
              'linux-headers-*-common' 'linux-kbuild-*' gcc gcc-14 binutils make pahole kmod | sort
            echo '[kernel-header-checksums]'
            (cd "$KDIR" && sha256sum include/config/auto.conf Module.symvers)
            echo '[module-vermagic]'
            cd "$stage"
            for module in fki.ko xnu.ko; do
              elf=$(readelf -h "$module")
              if ! grep -qE '^[[:space:]]*Class:[[:space:]]+ELF64$' <<< "$elf" ||
                 ! grep -qE '^[[:space:]]*Type:[[:space:]]+REL[[:space:]]' <<< "$elf" ||
                 ! grep -qE '^[[:space:]]*Machine:[[:space:]]+Advanced Micro Devices X86-64$' <<< "$elf"; then
                echo "$module is not an ELF64 x86-64 relocatable file" >&2
                exit 1
              fi
              vermagic=$(modinfo -F vermagic "./$module")
              if [[ ${vermagic%% *} != "$release" ]]; then
                echo "$module has vermagic '$vermagic', expected release '$release'" >&2
                exit 1
              fi
              printf '%s=%s\n' "$module" "$vermagic"
            done
            sha256sum fki.ko xnu.ko > SHA256SUMS
          ) > "$stage/build-manifest.txt"
      - uses: actions/upload-artifact@v4
        # Keep the build outputs for diagnosis if a later VM check fails.
        with:
          name: debian13-x86_64-module-build
          path: ${{ runner.temp }}/debian13-x86_64-module-build/
          if-no-files-found: error
          retention-days: 5
      - name: Test x86_64 XNU stub refusal on Debian 13
        run: tests/x86_64/test-xnu-stub-vm.sh "$KDIR"
      - name: Test x86_64 host-state boundary on Debian 13
        run: tests/x86_64/test-boundary-probe-vm.sh "$KDIR"
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Kernel headers
        id: kernel
        run: |
          scripts/ci/disable-microsoft-apt-feed.sh
          sudo apt-get update -qq
          pkg=$(apt-cache search --names-only '^linux-headers-[0-9.]+-[0-9]+-generic$' | awk '{print $1}' | sort -V | tail -1)
          echo "headers: $pkg"
          sudo apt-get install -y -qq "$pkg" >/dev/null
          echo "KDIR=/usr/src/$pkg" >> "$GITHUB_ENV"
          echo "release=${pkg#linux-headers-}" >> "$GITHUB_OUTPUT"
      - name: Build ARM64 modules through the CLI
        run: ARCH=x86_64 scripts/xnulinux build-modules
      - name: FKI carve-out probe
        run: make -C "$KDIR" M="$PWD/tests/qemu" KBUILD_EXTRA_SYMBOLS="$PWD/fki-ko/Module.symvers" modules
      - name: Module licenses
        run: |
          test "$(modinfo -F license fki-ko/fki.ko)" = GPL
          test "$(modinfo -F license xnu-ko/xnu.ko)" = Proprietary
      - name: Prepare ARM64 smoke test inputs
        env:
          KERNEL_RELEASE: ${{ steps.kernel.outputs.release }}
        run: |
          sudo apt-get install -y -qq cpio zstd
          stage=$(mktemp -d)
          (
            cd "$stage"
            apt-get download "linux-image-unsigned-$KERNEL_RELEASE" busybox-static
            dpkg-deb -x linux-image-unsigned-*.deb kernel
            dpkg-deb -x busybox-static_*.deb busybox
          )
          tests/qemu/prepare.sh "$stage/kernel/boot/vmlinuz-$KERNEL_RELEASE" \
            "$(find "$stage/busybox" -type f -name busybox)" fki-ko/fki.ko xnu-ko/xnu.ko \
            tests/qemu/fki-carve-probe.ko "$RUNNER_TEMP/qemu-guest"
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-arm64-guest
          path: ${{ runner.temp }}/qemu-guest/
          if-no-files-found: error
          retention-days: 3
  qemu:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-24.04, windows-2025, macos-15-intel]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qemu-arm64-guest
          path: qemu-guest
      - name: Install QEMU on Linux
        if: runner.os == 'Linux'
        run: |
          scripts/ci/disable-microsoft-apt-feed.sh
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-arm
      - name: Install QEMU on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $qemuDirectory = Join-Path $env:ProgramFiles 'qemu'
          $qemuSystem = Join-Path $qemuDirectory 'qemu-system-aarch64.exe'
          $installed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install qemu --yes --no-progress
            $chocoExitCode = $LASTEXITCODE
            $present = Test-Path -LiteralPath $qemuSystem -PathType Leaf
            if ($chocoExitCode -eq 0 -and $present) {
              $installed = $true
              break
            }
            if ($attempt -lt 3) {
              Write-Warning "QEMU install attempt $attempt did not provide qemu-system-aarch64.exe (Chocolatey exit $chocoExitCode); retrying."
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          if (-not $installed) {
            throw "QEMU install did not provide qemu-system-aarch64.exe after 3 attempts (Chocolatey exit $chocoExitCode)."
          }
          $qemuDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install QEMU on macOS
        if: runner.os == 'macOS'
        run: brew install qemu
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test QEMU console marker parser
        run: python tests/qemu/test_boot_parser.py
      - name: Smoke test the ARM64 modules
        run: |
          qemu-system-aarch64 --version
          python tests/qemu/boot.py qemu-guest
  build-linux-6-12:
    # Debian 13 keeps the older 6.12 API path covered on native ARM64.
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - name: Install Git for checkout
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates
      - uses: actions/checkout@v4
      - name: Build with Debian 13 Linux 6.12 headers
        run: |
          apt-get update -qq
          apt-get install -y -qq build-essential linux-headers-arm64
          kdir=$(find /usr/src -mindepth 1 -maxdepth 1 -type d -name 'linux-headers-*-arm64' | sort -V | tail -1)
          case "$kdir" in */linux-headers-6.12.*-arm64) ;; *) echo "expected Debian 13 Linux 6.12 headers; got $kdir" >&2; exit 1;; esac
          echo "headers: $kdir"
          make -C "$kdir" M="$GITHUB_WORKSPACE/fki-ko" modules
  spdx:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Network setup finds iptables in sudo secure_path
        run: bash tests/host/test-vm-net-up-sudo-path.sh
      - name: FKI setup applies and verifies BLS memory limits
        run: bash tests/host/test-vm-install-fki-bls.sh
      - name: Hosted service installer accepts configured disk paths
        run: bash tests/host/test-install-service.sh
      - name: Every source file has an SPDX-License-Identifier
        run: |
          missing=$(git ls-files '*.c' '*.h' '*.cpp' '*.mm' '*.m' '*.rs' '*.S' '*.s' '*.sh' '*.py' '*.metal' '*.comp' '*Makefile' |
            while read -r f; do head -3 "$f" | grep -q SPDX-License-Identifier || echo "$f"; done)
          [ -z "$missing" ] || { echo "no SPDX-License-Identifier:"; echo "$missing"; exit 1; }
      - name: Resolve relative PureDarwin workspace paths
        run: python3 tests/host/test_free_kc_dvm_path.py
