# SPDX-License-Identifier: GPL-2.0-only
# Build fki.ko and xnu.ko against the newest generic arm64 Ubuntu kernel's headers (the host the project runs on:
# Ubuntu 24.04 with its HWE kernel), and check that every source file names its license.
name: modules
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Kernel headers
        id: kernel
        run: |
          sudo apt-get update -qq
          pkg=$(apt-cache search --names-only '^linux-headers-[0-9.]+-[0-9]+-generic$' | awk '{print $1}' | sort -V | tail -1)
          echo "headers: $pkg"
          sudo apt-get install -y -qq "$pkg" >/dev/null
          echo "KDIR=/usr/src/$pkg" >> "$GITHUB_ENV"
          echo "release=${pkg#linux-headers-}" >> "$GITHUB_OUTPUT"
      - name: fki.ko
        run: make -C "$KDIR" M="$PWD/fki-ko" modules
      - name: xnu.ko
        run: make -C "$KDIR" M="$PWD/xnu-ko" KBUILD_EXTRA_SYMBOLS="$PWD/fki-ko/Module.symvers" modules
      - name: FKI carve-out probe
        run: make -C "$KDIR" M="$PWD/tests/qemu" KBUILD_EXTRA_SYMBOLS="$PWD/fki-ko/Module.symvers" modules
      - name: Module licenses
        run: |
          test "$(modinfo -F license fki-ko/fki.ko)" = GPL
          test "$(modinfo -F license xnu-ko/xnu.ko)" = Proprietary
      - name: Prepare ARM64 smoke test inputs
        env:
          KERNEL_RELEASE: ${{ steps.kernel.outputs.release }}
        run: |
          sudo apt-get install -y -qq cpio zstd
          stage=$(mktemp -d)
          (
            cd "$stage"
            apt-get download "linux-image-unsigned-$KERNEL_RELEASE" busybox-static
            dpkg-deb -x linux-image-unsigned-*.deb kernel
            dpkg-deb -x busybox-static_*.deb busybox
          )
          tests/qemu/prepare.sh "$stage/kernel/boot/vmlinuz-$KERNEL_RELEASE" \
            "$(find "$stage/busybox" -type f -name busybox)" fki-ko/fki.ko xnu-ko/xnu.ko \
            tests/qemu/fki-carve-probe.ko "$RUNNER_TEMP/qemu-guest"
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-arm64-guest
          path: ${{ runner.temp }}/qemu-guest/
          if-no-files-found: error
          retention-days: 3
  qemu:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qemu-arm64-guest
          path: qemu-guest
      - name: Install QEMU on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-arm
      - name: Install QEMU on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install qemu --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Join-Path $env:ProgramFiles 'qemu' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install QEMU on macOS
        if: runner.os == 'macOS'
        run: brew install qemu
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Smoke test the ARM64 modules
        run: |
          qemu-system-aarch64 --version
          python tests/qemu/boot.py qemu-guest
  spdx:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Every source file has an SPDX-License-Identifier
        run: |
          missing=$(git ls-files '*.c' '*.h' '*.cpp' '*.mm' '*.m' '*.rs' '*.S' '*.s' '*.sh' '*.py' '*.metal' '*.comp' '*Makefile' |
            while read -r f; do head -3 "$f" | grep -q SPDX-License-Identifier || echo "$f"; done)
          [ -z "$missing" ] || { echo "no SPDX-License-Identifier:"; echo "$missing"; exit 1; }
