name: PureDarwin root exporter

on:
  pull_request:
    paths:
      - 'scripts/puredarwin-root.sh'
      - 'tests/test-puredarwin-root-export*.sh'
      - 'docs/free-kc.md'
      - '.github/workflows/puredarwin-root-export.yml'

jobs:
  root-export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ext4 and partition tools
        run: sudo apt-get update && sudo apt-get install -y fdisk e2fsprogs
      - name: Check shell syntax
        run: bash -n scripts/puredarwin-root.sh tests/test-puredarwin-root-export.sh tests/test-puredarwin-root-export-signals.sh
      - name: Export a GPT ext4 root image
        run: sudo bash tests/test-puredarwin-root-export.sh
      - name: Clean up after SIGTERM during mount
        run: sudo bash tests/test-puredarwin-root-export-signals.sh
