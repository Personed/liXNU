# SPDX-License-Identifier: GPL-2.0-only
name: qemu-launcher
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  launcher:
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test platform launch options
        run: python tests/qemu/test_launcher.py
      - name: Test Windows cleanup and SDL window title parsing
        run: >-
          python tests/qemu/test_uefi_launch.py
          UefiLaunchTest.test_windows_cleanup_kills_launcher_when_taskkill_times_out
          UefiLaunchTest.test_windows_cleanup_falls_back_when_taskkill_cannot_start
          UefiLaunchTest.test_sdl_window_title_suffix_is_normalized
      - name: Install QEMU on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-system-arm qemu-efi-aarch64 qemu-utils
      - name: Install QEMU on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install qemu --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Join-Path $env:ProgramFiles 'qemu' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install QEMU on macOS
        if: runner.os == 'macOS'
        run: brew install qemu
      - name: Start an ARM64 guest through UEFI
        env:
          QEMU_TEST_REQUIRED: "1"
        run: python tests/qemu/test_uefi_launch.py UefiLaunchTest.test_launcher_starts_headless_uefi_guest
  uefi-graphical:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        display_backend: [gtk, sdl]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QEMU and ARM64 UEFI firmware
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-system-arm qemu-efi-aarch64 qemu-utils qemu-system-gui xvfb x11-utils
      - name: Start the graphical ARM64 guest through ${{ matrix.display_backend }}
        env:
          QEMU_TEST_REQUIRED: "1"
          QEMU_TEST_GRAPHICAL: "1"
          QEMU_TEST_DISPLAY_BACKEND: ${{ matrix.display_backend }}
        run: xvfb-run -a python tests/qemu/test_uefi_launch.py UefiLaunchTest.test_launcher_starts_graphical_uefi_guest
  uefi-launch:
    if: always()
    needs: uefi-graphical
    runs-on: ubuntu-24.04
    steps:
      - name: Require both graphical backends to pass
        env:
          GRAPHICAL_RESULT: ${{ needs.uefi-graphical.result }}
        run: test "$GRAPHICAL_RESULT" = success
