# SPDX-License-Identifier: GPL-2.0-only
name: qemu-launcher
on:
  push:
  pull_request:
jobs:
  launcher:
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test platform launch options
        run: python tests/qemu/test_launcher.py
      - name: Install QEMU on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install qemu --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Join-Path $env:ProgramFiles 'qemu' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install QEMU on macOS
        if: runner.os == 'macOS'
        run: brew install qemu
      - name: Start an ARM64 guest through UEFI on Windows and macOS
        if: runner.os != 'Linux'
        env:
          QEMU_TEST_REQUIRED: "1"
        run: python tests/qemu/test_uefi_launch.py
  uefi-launch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QEMU and ARM64 UEFI firmware
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-system-arm qemu-efi-aarch64 qemu-utils qemu-system-gui xvfb x11-utils
      - name: Start an ARM64 guest through the launcher
        env:
          QEMU_TEST_REQUIRED: "1"
        run: python tests/qemu/test_uefi_launch.py
      - name: Start the graphical ARM64 guest through GTK or SDL
        env:
          QEMU_TEST_REQUIRED: "1"
          QEMU_TEST_GRAPHICAL: "1"
        run: xvfb-run -a python tests/qemu/test_uefi_launch.py UefiLaunchTest.test_launcher_starts_graphical_uefi_guest
