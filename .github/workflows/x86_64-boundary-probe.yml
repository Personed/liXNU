# SPDX-License-Identifier: GPL-2.0-only
name: x86_64 boundary probe
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read
jobs:
  disposable-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install x86_64 kernel build and VM tools
        run: |
          scripts/ci/disable-microsoft-apt-feed.sh
          sudo apt-get update -qq
          pkg=$(apt-cache search --names-only '^linux-headers-[0-9.]+-[0-9]+-generic$' | awk '{print $1}' | sort -V | tail -1)
          test -n "$pkg" || { echo "no x86_64 generic kernel headers found" >&2; exit 1; }
          sudo apt-get install -y -qq build-essential busybox-static cpio qemu-system-x86 "$pkg" >/dev/null
          echo "KDIR=/usr/src/$pkg" >> "$GITHUB_ENV"
      - name: Check CR3 decoding and root placement fixtures
        run: bash tests/x86_64/test-fki-cr3.sh
      - name: Check x86 context control validation fixtures
        run: bash tests/x86_64/test-fki-x86-context.sh
      - name: Check x86 transaction state-machine fixtures
        run: bash tests/x86_64/test-fki-x86-transaction.sh
      - name: Check x86 memory ownership validation fixtures
        run: bash tests/x86_64/test-fki-x86-memory.sh
      - name: Check x86 stop-report validation fixtures
        run: bash tests/x86_64/test-fki-x86-stop-report.sh
      - name: Validate x86 exception ownership model fixtures
        run: bash tests/x86_64/test-fki-x86-exception-ownership.sh
      - name: Validate x86 syscall ownership model fixtures
        run: bash tests/x86_64/test-fki-x86-syscall-ownership.sh
      - name: Validate x86 control/memory ownership matrix fixtures
        run: bash tests/x86_64/test-fki-x86-control-memory-ownership.sh
      - name: Validate x86 CPU-quiescence decision fixtures
        run: bash tests/x86_64/test-fki-x86-cpu-quiescence-decision.sh
      - name: Validate x86 logical-offline proof-obligation fixtures
        run: bash tests/x86_64/test-fki-x86-logical-offline-obligations.sh
      - name: Validate x86 entry-architecture decision fixtures
        run: bash tests/x86_64/test-fki-x86-entry-architecture-decision.sh
      - name: Validate x86 cooperative handoff proof-obligation fixtures
        run: bash tests/x86_64/test-fki-x86-cooperative-handoff-obligations.sh
      - name: Run boundary probe and check kernel release rejection in QEMU TCG
        run: |
          release=$(cat "$KDIR/include/config/kernel.release")
          stage=$(mktemp -d "$RUNNER_TEMP/x86-boundary.XXXXXX")
          trap 'rm -rf -- "$stage"' EXIT
          (
            cd "$stage"
            apt-get download "linux-image-unsigned-$release"
            dpkg-deb -x ./*.deb image
          )
          kernel="$stage/image/boot/vmlinuz-$release"
          busybox=$(command -v busybox)
          tests/x86_64/test-boundary-probe-vm.sh "$KDIR" "$kernel" "$busybox"

          # Keep the same bootable image and modules. Set a different expected
          # release in the test initramfs and trace the guest init commands.
          mkdir -p "$stage/mismatch-bin"
          cat > "$stage/mismatch-bin/cpio" <<'CPIO'
          #!/bin/sh
          set -eu
          test -f expected-kernel-release
          printf '%s\n' boundary-release-fixture > expected-kernel-release
          sed -i '2i PS4="+ "; set -x' init
          exec /usr/bin/cpio "$@"
          CPIO
          chmod +x "$stage/mismatch-bin/cpio"
          log="$stage/mismatch.log"
          status=0
          PATH="$stage/mismatch-bin:$PATH" tests/x86_64/test-boundary-probe-vm.sh \
            "$KDIR" "$kernel" "$busybox" > "$log" 2>&1 || status=$?
          cat "$log"
          test "$status" -eq 1
          grep -F "kernel release mismatch: headers boundary-release-fixture, booted kernel $release" "$log"
          grep -F 'reboot: Power down' "$log"
          grep -F '+ uname -r' "$log"
          if grep -Eq '\+ ([^[:space:]]+/)?(busybox )?insmod([[:space:]]|$)' "$log"; then
            echo "boundary probe attempted to load a module before rejecting the kernel release" >&2
            exit 1
          fi
          if grep -Fq 'X86_BOUNDARY_PROBE_VM_PASS' "$log"; then
            echo "boundary probe reported success with a mismatched kernel release" >&2
            exit 1
          fi
