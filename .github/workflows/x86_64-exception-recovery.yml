# SPDX-License-Identifier: GPL-2.0-only
name: x86_64 exception recovery
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read
jobs:
  disposable-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install x86_64 kernel build and VM tools
        run: |
          scripts/ci/disable-microsoft-apt-feed.sh
          sudo apt-get update -qq
          pkg=$(apt-cache search --names-only '^linux-headers-[0-9.]+-[0-9]+-generic$' | awk '{print $1}' | sort -V | tail -1)
          test -n "$pkg" || { echo "no x86_64 generic kernel headers found" >&2; exit 1; }
          sudo apt-get install -y -qq build-essential busybox-static cpio qemu-system-x86 "$pkg" >/dev/null
          echo "KDIR=/usr/src/$pkg" >> "$GITHUB_ENV"
      - name: Build and run exception recovery in a disposable VM
        run: tests/x86_64/exception-recovery/test-vm.sh "$KDIR"
  disposable-vm-debian:
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Debian x86_64 build and VM tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates \
            build-essential busybox-static cpio linux-headers-amd64 qemu-system-x86 seabios
      - uses: actions/checkout@v4
      - name: Run the recovery VM with Debian APT inputs
        run: |
          kdir=$(find /usr/src -mindepth 1 -maxdepth 1 -type d -name 'linux-headers-*-amd64' | sort -V | tail -1)
          test -n "$kdir"
          echo "KDIR=$kdir" >> "$GITHUB_ENV"
          tests/x86_64/exception-recovery/test-vm.sh "$kdir"
      - name: Run the recovery VM with local boot inputs
        run: |
          release=$(cat "$KDIR/include/config/kernel.release")
          inputs=$(mktemp -d)
          trap 'rm -rf -- "$inputs"' EXIT
          (
            cd "$inputs"
            apt-get download "linux-image-$release-unsigned"
          )
          image_deb=$(find "$inputs" -name "linux-image-${release}-unsigned_*.deb" -print -quit)
          test -n "$image_deb"
          dpkg-deb -x "$image_deb" "$inputs/kernel"
          kernel="$inputs/kernel/boot/vmlinuz-$release"
          busybox=$(command -v busybox)
          tests/x86_64/exception-recovery/test-vm.sh "$KDIR" "$kernel" "$busybox"

          # Keep the real boot inputs and change only the expected release in a copy of the headers.
          mismatch_kdir="$inputs/mismatch-headers"
          mkdir "$mismatch_kdir"
          cp -aL "$KDIR/." "$mismatch_kdir/"
          printf '%s\n' lixnu-recovery-mismatch-fixture > "$mismatch_kdir/include/config/kernel.release"
          log="$inputs/mismatch.log"
          if tests/x86_64/exception-recovery/test-vm.sh "$mismatch_kdir" "$kernel" "$busybox" >"$log" 2>&1; then
            cat "$log"
            echo "kernel release mismatch passed the recovery VM" >&2
            exit 1
          fi
          cat "$log"
          grep -F "kernel release mismatch: headers lixnu-recovery-mismatch-fixture, booted kernel $release" "$log"
          grep -F 'reboot: Power down' "$log"
          if grep -Eq '^X86_EXCEPTION_RECOVERY_|x86-exception-recovery: test-only|Kernel panic' "$log"; then
            echo "mismatched guest ran the probe or panicked" >&2
            exit 1
          fi
