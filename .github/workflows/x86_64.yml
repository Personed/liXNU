# SPDX-License-Identifier: GPL-2.0-only
name: x86_64 launcher
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read
jobs:
  launcher-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install QEMU image tools for overlay integration test
        run: |
          if ! command -v qemu-img >/dev/null || ! command -v qemu-io >/dev/null; then
            scripts/ci/disable-microsoft-apt-feed.sh
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends qemu-utils
          fi
      - name: Shell syntax
        run: |
          for script in scripts/x86_64/xnulinux-boot.sh tests/x86_64/test-launcher.sh tests/x86_64/test-qemu-overlay-symlink.sh tests/x86_64/tcg-smoke.sh tests/x86_64/test-tcg-smoke.sh; do
            bash -n "$script"
          done
      - name: Launcher contract tests
        run: bash tests/x86_64/test-launcher.sh
      - name: QEMU overlay symlink integration
        run: bash tests/x86_64/test-qemu-overlay-symlink.sh
      - name: TCG smoke harness tests
        run: bash tests/x86_64/test-tcg-smoke.sh
      - name: Whitespace check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"
